name: NPM app build workflow

on:
  workflow_call:
    inputs:
      target:
        description: 'The target to build'
        type: string
        required: true
        default: './'
      node-version:
        description: 'The Node.js version to use'
        type: string
        required: true
        default: '22.x'
      npm-install-command:
        description: 'The npm install command to run'
        type: string
        required: true
        default: 'ci'
      skip-test:
        description: 'Whether to skip tests'
        type: string
        required: false
        default: 'false'
      npm-test-command:
        description: 'The npm test command to run'
        type: string
        required: false
        default: 'test'
      npm-build-command:
        description: 'The npm build command to run'
        type: string
        required: true
        default: 'build'
      is-docker-build:
        description: 'Whether this build is for a Docker image'
        type: boolean
        required: false
        default: true
      skip-sonar:
        description: 'Whether to run Sonar scan or not'
        type: string
        required: false
        default: 'false'
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install dependencies, build & test
        id: ci-init
        uses: tusharnayak1515/github-actions-workflows/.github/actions/npm-ci@master
        with:
          target: ${{ inputs.target }}
          node-version: ${{ inputs.node-version }}
          npm-install-command: ${{ inputs.npm-install-command }}
          skip-test: ${{ inputs.skip-test }}
          npm-test-command: ${{ inputs.npm-test-command }}
          npm-build-command: ${{ inputs.npm-build-command }}
          is-docker: ${{ inputs.is-docker-build }}
    outputs:
      app-name: ${{ steps.ci-init.outputs.app-name }}
      app-version: ${{ steps.ci-init.outputs.app-version }}
  security:
    name: Security Scans
    needs: [build]
    if: inputs.skip-sonar == 'false' && inputs.skip-test == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install dependencies, build & test
        uses: tusharnayak1515/github-actions-workflows/.github/actions/npm-ci@master
        with:
          target: ${{ inputs.target }}
          node-version: ${{ inputs.node-version }}
          npm-install-command: ${{ inputs.npm-install-command }}
          skip-test: ${{ inputs.skip-test }}
          npm-test-command: ${{ inputs.npm-test-command }}
          npm-build-command: ${{ inputs.npm-build-command }}
          is-docker: ${{ inputs.is-docker-build }}
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
  build-docker-image:
    name: Build & Push Docker image
    # needs: [build,security]
    if: ${{ needs.build.result == 'success' && (needs.security.result == 'success' || needs.security.result == 'skipped' || needs.security.result == null) && inputs.is-docker-build == true }}
    # if: needs.build.result == 'success' && needs.security.result == 'success' && inputs.is-docker-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Determine image tags
        id: image-tag
        shell: bash
        run: |
          APP_NAME="${{ needs.build.outputs.app-name }}"
          APP_VERSION="${{ needs.build.outputs.app-version }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"

          echo "image-tag=${DOCKER_USERNAME}/${APP_NAME}:${APP_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build & Push Docker Image
        id: build-push-docker-image
        working-directory: ${{ inputs.target }}
        shell: bash
        run: |
          IMAGE_TAG="${{ steps.image-tag.outputs.image-tag }}"
          echo "Logging in to Docker Hub..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin >/dev/null 2>&1

          echo "Login to Docker Hub successful!"

          echo "Building docker image..."

          pwd
          docker build -t "$IMAGE_TAG" .

          echo "Docker image built successfully!"

          echo "Pushing docker image to Docker hub..."
          docker push "$IMAGE_TAG"
          echo "DOcker image successfully pushed to Docker Hub!"

      - name: Image Build Summary
        shell: bash
        run: |
          echo "✅ Docker image built and pushed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Image Tag: ${{ steps.image-tag.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Latest Tag: ${{ secrets.DOCKER_USERNAME }}/${{ needs.build.outputs.app-name }}:latest" >> "$GITHUB_STEP_SUMMARY"

