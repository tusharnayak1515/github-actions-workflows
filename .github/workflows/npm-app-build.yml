name: NPM app build workflow

on:
  workflow_call:
    inputs:
      target:
        description: 'The target to build'
        type: string
        required: true
        default: './'
      node-version:
        description: 'The Node.js version to use'
        type: string
        required: true
        default: '22.x'
      npm-install-command:
        description: 'The npm install command to run'
        type: string
        required: true
        default: 'ci'
      skip-test:
        description: 'Whether to skip tests'
        type: string
        required: false
        default: 'false'
      npm-test-command:
        description: 'The npm test command to run'
        type: string
        required: false
        default: 'test'
      npm-build-command:
        description: 'The npm build command to run'
        type: string
        required: true
        default: 'build'
      is-docker-build:
        description: 'Whether this build is for a Docker image'
        type: string
        required: false
        default: 'true'
      skip-sonar:
        description: 'Whether to run Sonar scan or not'
        type: string
        required: false
        default: 'false'
    secrets:
      DOCKER_USERNAME:
        required: true
      DOCKER_PASSWORD:
        required: true
      SONAR_TOKEN:
        required: true
      SONAR_HOST_URL:
        required: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Install dependencies, build & test
        id: ci-init
        uses: tusharnayak1515/github-actions-workflows/.github/actions/npm-ci@master
        with:
          target: ${{ inputs.target }}
          node-version: ${{ inputs.node-version }}
          npm-install-command: ${{ inputs.npm-install-command }}
          skip-test: ${{ inputs.skip-test }}
          npm-test-command: ${{ inputs.npm-test-command }}
          npm-build-command: ${{ inputs.npm-build-command }}
          is-docker: ${{ inputs.is-docker-build }}
      - name: SonarQube Scan
        if: inputs.skip-sonar == 'false' && inputs.skip-test == 'false'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.branch.name=${{ github.ref_name }}
    outputs:
      app-name: ${{ steps.ci-init.outputs.app-name }}
      app-version: ${{ steps.ci-init.outputs.app-version }}
  # security:
  #   name: Security Scans
  #   needs: [build]
  #   runs-on: ubuntu-latest
