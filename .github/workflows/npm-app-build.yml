  #         npm-install-command: ${{ inputs.npm-install-command }}
  #         skip-test: ${{ inputs.skip-test }}
  #         npm-test-command: ${{ inputs.npm-test-command }}
  #         npm-build-command: ${{ inputs.npm-build-command }}
  #         is-docker: ${{ inputs.is-docker-build }}
  #     - name: SonarQube Scan
  #       if: inputs.skip-sonar == 'false' && inputs.skip-test == 'false'
  #       uses: SonarSource/sonarqube-scan-action@v5
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #       with:
  #         args: >
  #           -Dsonar.branch.name=${{ github.ref_name }}
  build-docker-image:
    name: Build & Push Docker image
    # needs: [build, security]
    needs: [build]
    if: needs.build.result == 'success' && inputs.is-docker-build == 'true'
    # if: needs.build.result == 'success' && (needs.security.result == 'success' || needs.security.result == 'skipped' || needs.security.result == null) && inputs.is-docker-build == 'true'
    # if: needs.build.result == 'success' && needs.security.result == 'success' && inputs.is-docker-build == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Determine image tags
        id: image-tag
        shell: bash
        run: |
          APP_NAME="${{ needs.build.outputs.app-name }}"
          APP_VERSION="${{ needs.build.outputs.app-version }}"
          DOCKER_USERNAME="${{ secrets.DOCKER_USERNAME }}"

          echo "image-tag=${DOCKER_USERNAME}/${APP_NAME}:${APP_VERSION}" >> "$GITHUB_OUTPUT"
      - name: Build Docker Image
        id: build-docker-image
        working-directory: ${{ inputs.target }}
        shell: bash
        run: |
          IMAGE_TAG="${{ steps.image-tag.outputs.image-tag }}"

          echo "Building docker image..."

          pwd
          docker build --no-cache -t "$IMAGE_TAG" .

          echo "Docker image built successfully!"

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.20.0
        with:
          image-ref: "${{ steps.image-tag.outputs.image-tag }}"
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          # severity: CRITICAL
          trivyignores: .trivyignore

      - name: Push Docker Image
        id: push-docker-image
        working-directory: ${{ inputs.target }}
        shell: bash
        run: |
          IMAGE_TAG="${{ steps.image-tag.outputs.image-tag }}"
          echo "Logging in to Docker Hub..."
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin >/dev/null 2>&1

          echo "Login to Docker Hub successful!"
          echo "Pushing docker image to Docker hub..."
          docker push "$IMAGE_TAG"
          echo "Docker image successfully pushed to Docker Hub!"

      - name: Image Build Summary
        shell: bash
        run: |
          echo "✅ Docker image built and pushed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Image Tag: ${{ steps.image-tag.outputs.image-tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "📦 Latest Tag: ${{ secrets.DOCKER_USERNAME }}/${{ needs.build.outputs.app-name }}:latest" >> "$GITHUB_STEP_SUMMARY"

