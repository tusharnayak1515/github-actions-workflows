name: Deploy App

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub environment (e.g., staging, production)'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy - ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy App
        shell: bash
        run: |
          echo "Deploying app in ${{ inputs.environment }}..."
          sleep 5s
          echo "${{ vars.message }}"
          sleep 5s
          echo "Deployment successful in ${{ inputs.environment }}!"

  validate:
    name: Validate Deployment
    needs: [deploy]
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Health check
        shell: bash
        run: |
          ENV=${{ inputs.environment }}
          if [[ "$ENV" == "DEV" ]]; then
            exit 1
          fi
  rollback:
    name: Rollback
    needs: [deploy,validate]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    steps:
      - name: Rollback
        shell: bash
        run: |
          echo "Rolling back to ${{ vars.LAST_DEPLOYED_VERSION_DEV }}..."
          sleep 5s
          echo "Rollback completed to version: ${{ vars.LAST_DEPLOYED_VERSION_DEV }}"
