name: Test Reusable Workflow

on:
  workflow_call:
    inputs:
      name:
        type: string
        description: "User Name"
        default: "User"
        required: true
    secrets:
      TOKEN:
        required: true

jobs:
  greet:
    name: Greet
    runs-on: ubuntu-latest
    steps:
      - name: Greet User
        id: greet
        shell: bash
        run: |
          NAME=${{ inputs.name }}
          echo "Hello, $NAME"

          touch .env
          echo "TOKEN=${{ secrets.TOKEN }}" >> .env

          echo "Stored the secret!"
          size=${#NAME}
          val="$NAME: $size"
          echo "val=$val" >> "$GITHUB_OUTPUT"
    outputs:
      val: ${{ steps.greet.outputs.val }}
