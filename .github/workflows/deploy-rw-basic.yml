name: Deploy App

on:
  workflow_call:
    inputs:
      environment:
        description: 'Target GitHub environment (e.g., staging, production)'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy - ${{ inputs.environment }}
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy App
        shell: bash
        run: |
          echo "Deploying app in ${{ inputs.environment }}..."
          sleep 5s
          echo "${{ vars.message }}"
          sleep 5s
          echo "Deployment successful in ${{ inputs.environment }}!"
